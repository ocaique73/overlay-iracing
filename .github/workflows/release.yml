# Gera o instalador do Windows e publica no GitHub Releases sempre que a versão do package.json
# muda na branch main (ou manualmente pelo botão "Run workflow").
# O app instalado procura atualização nesses releases.
name: release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versão já publicada?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --json assets -q '.assets[].name' 2>/dev/null | grep -q '^latest.yml$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            # release incompleto (sem latest.yml) de uma tentativa anterior: apaga e refaz
            gh release delete "v$VER" --yes --cleanup-tag 2>/dev/null || true
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.exists == 'false'
        run: npm ci
      - if: steps.check.outputs.exists == 'false'
        run: npm run dist
      - name: Publica o release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.check.outputs.version }}
          gh release create "v$VER" dist/*.exe dist/*.blockmap dist/latest.yml \
            --title "v$VER" --notes "Baixe o Overlay-iRacing-Setup-$VER.exe e instale. Quem já tem o app instalado recebe o aviso de atualização no painel." --latest
