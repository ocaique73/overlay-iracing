<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Overlay iRacing</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="logo"><span>OVERLAY</span> iRacing</div>
    <div id="status" class="status"></div>
    <div class="spacer"></div>
    <label class="field"><span data-t="language"></span>
      <select id="lang"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select>
    </label>
    <label class="switch"><input type="checkbox" id="demo"><i></i><span data-t="demo"></span></label>
    <button id="updBtn" class="upd hidden"></button>
    <button id="lock" class="lock"></button>
  </header>
  <div class="hint" id="hint"></div>
  <div class="profiles" id="profiles"></div>
  <main id="list"></main>
  <footer>
    <label class="field"><span data-t="margin"></span><input type="number" id="margin" min="0" max="200" step="2"> px</label>
    <label class="switch"><input type="checkbox" id="onlyInCar"><i></i><span id="onlyInCarLbl"></span></label>
    <button id="logos" class="ghost" data-t="logos"></button>
    <span class="ver"><span id="verTxt"></span> <button id="checkUpd" class="ghost small"></button></span>
  </footer>
  <script src="panel.js"></script>
</body>
</html>
